version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: financial_audit_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - audit_network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: financial_audit_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - audit_network

networks:
  audit_network:
    driver: bridge